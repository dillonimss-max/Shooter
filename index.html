<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Arcade Shooter</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #1a1a1a;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        #scoreBoard {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="scoreBoard">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    let score = 0;
    let gameOver = false;

    const player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 15,
        color: '#3498db'
    };

    const bullets = [];
    const enemies = [];
    const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

    window.addEventListener('mousemove', (event) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = event.clientX - rect.left;
        mouse.y = event.clientY - rect.top;
    });

    window.addEventListener('click', () => {
        if (gameOver) return;
        const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        bullets.push({
            x: player.x,
            y: player.y,
            radius: 5,
            color: '#f1c40f',
            velocity: {
                x: Math.cos(angle) * 7,
                y: Math.sin(angle) * 7
            }
        });
    });

    setInterval(() => {
        if (gameOver) return;
        const radius = Math.random() * (25 - 10) + 10;
        let x, y;

        if (Math.random() < 0.5) {
            x = Math.random() < 0.5 ? 0 - radius : canvas.width + radius;
            y = Math.random() * canvas.height;
        } else {
            x = Math.random() * canvas.width;
            y = Math.random() < 0.5 ? 0 - radius : canvas.height + radius;
        }

        const angle = Math.atan2(player.y - y, player.x - x);
        enemies.push({
            x: x,
            y: y,
            radius: radius,
            color: '#e74c3c',
            velocity: {
                x: Math.cos(angle) * 2,
                y: Math.sin(angle) * 2
            }
        });
    }, 1000);

    function animate() {
        requestAnimationFrame(animate);
        ctx.fillStyle = 'rgba(26, 26, 26, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (gameOver) {
            ctx.fillStyle = 'white';
            ctx.font = '40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
            return;
        }

        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();

        bullets.forEach((bullet, bIndex) => {
            bullet.x += bullet.velocity.x;
            bullet.y += bullet.velocity.y;

            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
            ctx.fillStyle = bullet.color;
            ctx.fill();

            if (bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
                setTimeout(() => bullets.splice(bIndex, 1), 0);
            }
        });

        enemies.forEach((enemy, eIndex) => {
            enemy.x += enemy.velocity.x;
            enemy.y += enemy.velocity.y;

            ctx.beginPath();
            ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
            ctx.fillStyle = enemy.color;
            ctx.fill();

            const distToPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
            if (distToPlayer - enemy.radius - player.radius < 1) {
                gameOver = true;
            }

            bullets.forEach((bullet, bIndex) => {
                const distToBullet = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                if (distToBullet - enemy.radius - bullet.radius < 1) {
                    setTimeout(() => {
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                        scoreElement.innerText = score;
                    }, 0);
                }
            });
        });
    }

    animate();
</script>
</body>
</html>
