<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GitHub Arena Shooter</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 71, 87, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            z-index: 20;
            cursor: pointer;
        }
        .highlight { color: #ff4757; }
    </style>
    <!-- Importing the Three.js 3D Rendering Core Engine Libraries -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="hud">Score: <span id="score" class="highlight">0</span></div>
    <div id="crosshair"></div>

    <div id="blocker">
        <h1 style="font-size: 40px; margin-bottom: 5px;">3D ARENA DEMO</h1>
        <p style="font-size: 18px; color: #a4b0be; margin-bottom: 25px;">Click anywhere on screen to lock mouse & deploy</p>
        <div style="font-size: 14px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px;">
            Move: <span class="highlight">W A S D</span> | Look Around: <span class="highlight">MOUSE</span> | Open Fire: <span class="highlight">LEFT CLICK</span>
        </div>
    </div>

<script>
    // 3D Scene Core Setup Variables
    let scene, camera, renderer;
    let score = 0;
    const scoreElement = document.getElementById('score');
    const blocker = document.getElementById('blocker');

    // Movement Tracking States
    const move = { forward: false, backward: false, left: false, right: false };
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let clock = new THREE.Clock();

    // Mouse Look Camera Variables
    let pitchObject = new THREE.Object3D();
    let yawObject = new THREE.Object3D();

    // Lists for interacting objects
    const bots = [];
    const bullets = [];
    let playerGun;

    // 1. Core Game Initialization
    function init() {
        // Create 3D World space
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);
        scene.fog = new THREE.FogExp2(0x0a0a12, 0.015);

        // Build Viewport Camera Perspective View settings
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Assemble First Person Camera Rig structures
        pitchObject.add(camera);
        yawObject.position.y = 2; // Height off ground
        yawObject.add(pitchObject);
        scene.add(yawObject);

        // Ambient System Lighting setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(20, 40, 20);
        scene.add(directionalLight);

        // Create Grid Tactical Arena Floor 
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e1e24, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const grid = new THREE.GridHelper(100, 50, 0xff4757, 0x2c2c35);
        grid.position.y = 0.01;
        scene.add(grid);

        // Build a simplified 3D Gun Model block strapped directly to player viewport camera
        const gunGeo = new THREE.BoxGeometry(0.1, 0.1, 0.5);
        const gunMat = new THREE.MeshStandardMaterial({ color: 0x2f3542, metalness: 0.8 });
        playerGun = new THREE.Mesh(gunGeo, gunMat);
        playerGun.position.set(0.2, -0.2, -0.4); // Stays on bottom right corner of screen
        camera.add(playerGun);

        // WebGL Engine Output configuration hooks
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Setup Controls Listeners
        initControls();

        // Spawn starting wave of 3D enemy drone units
        for (let i = 0; i < 10; i++) spawnBot();

        // Kick off Main Frame Execution Core Tick Ticker loop
        animate();
    }

    // 2. Control Layout Hooks & Pointer Lock API Setup (For FPS Camera Control)
    function initControls() {
        blocker.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                blocker.style.display = 'none';
            } else {
                blocker.style.display = 'flex';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body) return;
            // Left/Right rotation adjustments
            yawObject.rotation.y -= e.movementX * 0.002;
            // Up/Down pitch looking constraints
            pitchObject.rotation.x -= e.movementY * 0.002;
            pitchObject.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitchObject.rotation.x));
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') move.forward = true;
            if (e.key === 's' || e.key === 'S') move.backward = true;
            if (e.key === 'a' || e.key === 'A') move.left = true;
            if (e.key === 'd' || e.key === 'D') move.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') move.forward = false;
            if (e.key === 's' || e.key === 'S') move.backward = false;
            if (e.key === 'a' || e.key === 'A') move.left = false;
            if (e.key === 'd' || e.key === 'D') move.right = false;
        });

        window.addEventListener('click', () => {
            if (document.pointerLockElement !== document.body) return;
            fireBullet();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    // 3. Projectile Creation Handler Logic
    function fireBullet() {
        // Create 3D Projectile geometry sphere object
        const bGeo = new THREE.SphereGeometry(0.05, 8, 8);
        const bMat = new THREE.MeshBasicMaterial({ color: 0xffea82 });
        const bullet = new THREE.Mesh(bGeo, bMat);

        // Get total forward pointing direction from camera vector matrix paths
        const dir = new THREE.Vector3();
        camera.getWorldDirection(dir);

        // Spawn position right near gun nozzle tip calculations
        bullet.position.copy(yawObject.position).add(dir.clone().multiplyScalar(0.5));
        bullet.velocity = dir.multiplyScalar(35); // Initial velocity force mapping lines
        bullet.aliveTime = 0;

        scene.add(bullet);
        bullets.push(bullet);
    }

    // 4. Enemy 3D Bot Spawning Node Engines
    function spawnBot() {
        const size = Math.random() * 1.5 + 0.8;
        const bGeo = new THREE.BoxGeometry(size, size, size);
        const bMat = new THREE.MeshStandardMaterial({ color: 0xff4757, roughness: 0.4 });
        const bot = new THREE.Mesh(bGeo, bMat);

        // Assign coordinate slots randomly on field layout grids
        bot.position.x = (Math.random() - 0.5) * 80;
        bot.position.z = (Math.random() - 0.5) * 80;
        bot.position.y = size / 2; // Resting on ground layout line borders

        scene.add(bot);
        bots.push(bot);
    }

    // 5. Framerate Animation Frame Tick Runner loop
    function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();

        if (document.pointerLockElement === document.body) {
            // Player Translation Calculation matrix trackers
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(move.forward) - Number(move.backward);
            direction.x = Number(move.right) - Number(move.left);
            direction.normalize(); 

            if (move.forward || move.backward) velocity.z -= direction.z * 60.0 * delta;
            if (move.left || move.right) velocity.x -= direction.x * 60.0 * delta;

            yawObject.translateX(-velocity.x * delta);
            yawObject.translateZ(velocity.z * delta);
            
            // Hard clamp floor wall boundary line parameters
            yawObject.position.x = Math.max(-48, Math.min(48, yawObject.position.x));
            yawObject.position.z = Math.max(-48, Math.min(48, yawObject.position.z));
        }

        // Projectile Tracking loop
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
